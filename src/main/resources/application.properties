############################################################
# CloudCart Application Configuration
############################################################

# ----------------------------------------------------------
# Application Name
# This name is used internally by Spring Boot.
# ----------------------------------------------------------
spring.application.name=CloudCart


# ----------------------------------------------------------
# Server Port
# Default is 8080.
# Change this if another application is already using 8080.
# ----------------------------------------------------------
server.port=8080


# ----------------------------------------------------------
# Disable Thymeleaf Cache
# Useful during development because HTML changes are visible
# immediately without restarting the application.
# Later in production we'll enable caching.
# ----------------------------------------------------------
spring.thymeleaf.cache=false


# ----------------------------------------------------------
# Logging Level
# INFO is sufficient for development.
# Later we'll configure DEBUG or ERROR as needed.
# ----------------------------------------------------------
logging.level.root=INFO